<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Loja</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@300;400;500;600;700;800&amp;display=swap">
<style>
/* Página da loja, mobile only (mesmo padrão do index.html) */
:root {
  --page: #fff; --text1: #161823; --text2: rgba(22,24,35,.75); --text3: rgba(22,24,35,.5);
  --neutral3: rgba(22,24,35,.12); --neutral4: rgba(22,24,35,.06);
  --primary: #fe2c55; --teal: #12a594; --tealtx: #0e8a7d; --flash: #ff5a1f; --star: #ffbb00;
  --marca: #06142a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #ececee; }
body { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--page); color: var(--text1); box-shadow: 0 0 24px rgba(0,0,0,.08);
  font-family: 'TikTok Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.4; padding-bottom: 40px; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
body.lock { overflow: hidden; }

/* topo com a cor da marca */
.band { position: absolute; left: 0; right: 0; top: 0; height: 300px; background: linear-gradient(180deg, var(--marca) 0%, var(--marca) 45%, #fff 100%); overflow: hidden; z-index: 0; }
.band::before { content: ''; position: absolute; right: 8%; top: -30px; width: 220px; height: 220px; transform: rotate(14deg); background: #fff; opacity: .06;
  -webkit-mask: url(images/nota.png) center / contain no-repeat; mask: url(images/nota.png) center / contain no-repeat; }
.wrap { position: relative; }
.hdr { position: sticky; top: 0; z-index: 50; height: 56px; display: flex; align-items: center; gap: 2px; padding: 0 6px; color: #fff; transition: background .2s, color .2s; }
.hdr.solid { background: #fff; color: var(--text1); box-shadow: 0 1px 0 var(--neutral4); }
.hdr .sp { flex: 1; }
.hbtn { position: relative; width: 44px; height: 44px; border: none; background: none; color: inherit; display: flex; align-items: center; justify-content: center; }
.badge { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
.badge[hidden] { display: none; }
.busca { flex: 1; height: 36px; border-radius: 8px; border: none; background: var(--neutral4); padding: 0 12px; font: inherit; font-size: 16px; color: var(--text1); }
.busca[hidden] { display: none; }

/* cartão da loja */
.card { position: relative; z-index: 1; margin: 6px 12px 0; background: #fff; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.08); padding: 14px 0 14px 14px; }
.ct { display: flex; align-items: center; gap: 12px; padding-right: 14px; }
.logo { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--marca); }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.ci { flex: 1; min-width: 0; }
.ci h1 { font-size: 17px; font-weight: 700; line-height: 1.25; }
.ci .meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 13px; color: var(--text2); flex-wrap: wrap; }
.estrela { background: #ffe1c2; color: #7a3e00; font-weight: 600; font-size: 12px; padding: 1px 6px; border-radius: 4px; }
.cb { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.cb button { height: 30px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 700; }
.seguir { border: none; background: var(--primary); color: #fff; }
.seguir.on { background: var(--neutral4); color: var(--text1); }
.msg { border: 1px solid var(--neutral3); background: #fff; color: var(--text1); }
.cps { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none; margin-top: 12px; padding-right: 14px; }
.cps::-webkit-scrollbar { display: none; }
.cp { flex: 0 0 76%; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(254,44,85,.18); background: #fff4f6; }
.cp.frete { background: #effafa; border-color: rgba(14,138,125,.22); }
.cp .tx { flex: 1; min-width: 0; }
.cp b { display: block; font-size: 14px; }
.cp p { font-size: 12px; color: var(--text2); line-height: 1.3; }
.cp button { flex-shrink: 0; height: 28px; padding: 0 12px; border-radius: 6px; border: none; background: var(--primary); color: #fff; font-size: 13px; font-weight: 700; }
.cp.frete button { background: var(--teal); }
.cp.site button { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
.cp button:disabled { background: var(--neutral4) !important; color: var(--text3) !important; border-color: transparent !important; }

/* abas */
.tabs { position: sticky; top: 56px; z-index: 40; background: #fff; display: flex; border-bottom: 1px solid var(--neutral3); margin-top: 12px; }
.tabs button { flex: 1; height: 46px; border: none; background: none; font-size: 16px; font-weight: 600; color: var(--text3); border-bottom: 3px solid transparent; }
.tabs button.on { color: var(--text1); border-bottom-color: var(--text1); }
.pane[hidden] { display: none; }
.sec { padding: 16px 16px 4px; }
.sec + .sec { border-top: 8px solid #f4f4f5; }
.sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.sh h2 { font-size: 18px; font-weight: 700; }
.sh .more { border: none; background: none; font-size: 14px; color: var(--text2); display: flex; align-items: center; gap: 2px; }
.flash-t { display: flex; align-items: center; gap: 2px; }
.flash-t svg { color: var(--flash); }
.cd { display: flex; align-items: center; gap: 3px; font-size: 13px; }
.cd b { background: var(--neutral4); border-radius: 4px; padding: 1px 4px; font-variant-numeric: tabular-nums; }
.vazio { color: var(--text3); font-size: 14px; padding: 8px 0 16px; }

/* card de lista (Produtos e Oferta relâmpago) */
.li { display: flex; gap: 12px; padding: 10px 0; }
.li > a:first-child { flex-shrink: 0; }
.li > a > img { width: 112px; height: 112px; border-radius: 8px; object-fit: cover; background: var(--neutral4); flex-shrink: 0; }
.li .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li h3 { font-size: 14px; font-weight: 400; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 3px; background: #ffe5ea; color: var(--primary); white-space: nowrap; }
.tag.verde { background: #e3f6f3; color: var(--tealtx); }
.tag.flash { background: var(--flash); color: #fff; }
.rt { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 12px; color: var(--text2); }
.rt .vl { width: 1px; height: 10px; background: var(--neutral3); }
.bar { position: relative; height: 16px; border-radius: 8px; background: #ffe8e0; margin-top: 6px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ff7a3d, var(--flash)); border-radius: 8px; }
.bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
.pf { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 6px; }
.pr { color: var(--primary); white-space: nowrap; }
.pr b { font-size: 18px; }
.pr small { font-size: 12px; font-weight: 700; }
.pr s { display: block; font-size: 12px; color: var(--text3); }
.buy { display: flex; flex-shrink: 0; }
.buy button { height: 32px; border: none; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.buy .c { width: 38px; background: #ffe9ee; color: var(--primary); border-radius: 6px 0 0 6px; }
.buy .k { padding: 0 12px; background: var(--primary); color: #fff; border-radius: 0 6px 6px 0; }

/* cards em grade (Início) */
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gc { display: flex; flex-direction: column; min-width: 0; position: relative; }
.gc img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; background: var(--neutral4); }
.gc h3 { font-size: 13px; font-weight: 400; line-height: 1.3; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gc .pr b { font-size: 16px; }
.gc .gp { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 4px; }
.gc .ft { position: relative; }
.gc .add { position: absolute; right: 6px; bottom: 6px; width: 34px; height: 34px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; padding: 0; }
.gc .add img { width: 20px; height: 20px; }
.gc .add:active { transform: scale(.92); }
.gc .pr b { font-size: 15px; }
.buy .c img { width: 20px; height: 20px; }
.rank { position: absolute; z-index: 2; left: 6px; top: 0; width: 22px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #6b4b00; background: #ffd66b; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }
.rank.r2 { background: #d9dde3; color: #3b4250; }
.rank.r3 { background: #f2c2a0; color: #6b3b18; }

/* Produtos: filtros */
.fil { display: flex; align-items: center; gap: 4px; padding: 12px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.fil::-webkit-scrollbar { display: none; }
.fil button { flex-shrink: 0; border: none; background: none; font-size: 15px; font-weight: 600; color: var(--text3); padding: 4px 8px; white-space: nowrap; display: flex; align-items: center; gap: 2px; }
.fil button.on { color: var(--text1); }
.fil .sep { width: 1px; height: 14px; background: var(--neutral3); flex-shrink: 0; }
.lista { padding: 0 16px; }

/* Categorias */
.cat { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 16px; border: none; background: none; text-align: left; color: var(--text1); }
.cat img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; border: 1px solid var(--neutral4); }
.cat b { flex: 1; font-size: 16px; }
.cat span { color: var(--text3); }

.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(22,24,35,.9); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 200; white-space: nowrap; }
.to-top { position: fixed; right: max(16px, calc(50% - 240px + 16px)); bottom: 24px; z-index: 60; width: 44px; height: 44px; border-radius: 50%; border: none; background: #fff; color: var(--text1); box-shadow: 0 2px 12px rgba(0,0,0,.15); display: flex; align-items: center; justify-content: center; }
.to-top[hidden] { display: none; }
</style>
<script src="js/rastreio.js"></script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1796468168324547&ev=PageView&noscript=1" alt=""></noscript>
</head>
<body>
<div class="band" id="band"></div>
<div class="wrap">
  <header class="hdr" id="hdr">
    <button class="hbtn" id="hBack" aria-label="Voltar"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4 7 12l8 8"></path></svg></button>
    <input class="busca" id="busca" type="search" placeholder="Buscar nesta loja" aria-label="Buscar nesta loja" hidden="">
    <span class="sp" id="sp"></span>
    <button class="hbtn" id="hSearch" aria-label="Buscar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg></button>
    <button class="hbtn" id="hShare" aria-label="Compartilhar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 4.5 21 11.5l-7.5 7v-4c-5 0-8.5 1.5-10.5 5 .6-5.5 3.5-10 10.5-11v-4Z"></path></svg></button>
    <a class="hbtn" href="../checkout.html/index.html" aria-label="Carrinho"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h2.6l2.3 11.2h11.1l2-8H6.3"></path><circle cx="9" cy="19.5" r="1.4" fill="currentColor"></circle><circle cx="17" cy="19.5" r="1.4" fill="currentColor"></circle></svg><span class="badge" id="badge" hidden="">0</span></a>
  </header>

  <section class="card" aria-label="Loja">
    <div class="ct">
      <div class="logo"><img id="lLogo" alt=""></div>
      <div class="ci"><h1 id="lNome"></h1><div class="meta"><span class="estrela" id="lSelo"></span><span id="lVend"></span></div></div>
      <div class="cb"><button class="seguir" id="seguir">Seguir</button><button class="msg" id="msg">Mensagem</button></div>
    </div>
    <div class="cps" id="cps"></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-t="inicio" class="on">Início</button>
    <button role="tab" data-t="produtos">Produtos</button>
    <button role="tab" data-t="categorias">Categorias</button>
  </nav>

  <div class="pane" id="p-inicio"></div>
  <div class="pane" id="p-produtos" hidden="">
    <div class="fil" id="fil">
      <button data-o="rec" class="on">Recomendados</button><span class="sep"></span>
      <button data-o="vend">Mais vendidos</button><span class="sep"></span>
      <button data-o="novo">Lançamentos</button><span class="sep"></span>
      <button data-o="preco">Preço <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 4 7 10h10zM12 20l5-6H7z"></path></svg></button>
    </div>
    <div class="lista" id="lista"></div>
  </div>
  <div class="pane" id="p-categorias" hidden=""></div>
</div>

<button type="button" class="to-top" id="toTop" aria-label="Voltar ao topo" hidden=""><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14M12 20V9m-5 5 5-5 5 5"></path></svg></button>

<script src="js/dados.js"></script>
<script>
const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtK = n => n >= 1000 ? (Math.round(n / 100) / 10).toString().replace('.', ',') + ' mil' : String(n);
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ---------- loja ----------
document.title = LOJA.nome;
document.documentElement.style.setProperty('--marca', LOJA.cor);
if (LOJA.logo) $('lLogo').src = LOJA.logo; else $('lLogo').hidden = true;
$('lNome').textContent = LOJA.nome;
$('lSelo').textContent = LOJA.selo; $('lSelo').hidden = !LOJA.selo;
$('lVend').textContent = `${fmtK(LOJA.vendidos)} vendidos`;
const segKey = 'segue:' + LOJA.nome;
function setSeg(v) { $('seguir').classList.toggle('on', v); $('seguir').textContent = v ? 'Seguindo' : 'Seguir'; }
setSeg(!!lsGet(segKey, false));
$('seguir').onclick = () => { const v = !$('seguir').classList.contains('on'); setSeg(v); lsSet(segKey, v); toast(v ? 'Você está seguindo a loja' : 'Você deixou de seguir'); };
$('msg').onclick = () => toast('Chat da loja em breve');

// cupons (mesmo armazenamento da página do produto: o checkout desconta sozinho)
let ativos = lsGet('cuponsAtivos', []);
function renderCupons() {
  $('cps').innerHTML = LOJA.cupons.map(c => {
    const on = ativos.some(a => a.id === c.id), usar = false;
    return `<div class="cp ${c.tipo}"><div class="tx"><b>${c.titulo}</b><p>${c.condicao}</p></div>
      <button data-c="${c.id}" ${on ? 'disabled' : ''}>${on ? (usar ? 'Aplicado' : 'Resgatado') : (usar ? 'Usar' : 'Resgatar')}</button></div>`;
  }).join('');
}
$('cps').onclick = e => {
  const b = e.target.closest('[data-c]'); if (!b) return;
  const c = LOJA.cupons.find(x => x.id === b.dataset.c);
  ativos.push({ id: c.id, tipo: c.tipo, titulo: c.titulo, pct: c.pct || 0, max: c.max || 0, valor: c.valor || 0, min: c.min || 0 });
  lsSet('cuponsAtivos', ativos); renderCupons();
  toast('Cupom resgatado! Ele já vale no checkout');
};
renderCupons();

// carrinho
const badge = $('badge');
const somaCarrinho = () => lsGet('carrinho', []).reduce((s, i) => s + i.qtd, 0);
function atualizaBadge() { const n = somaCarrinho(); badge.textContent = n; badge.hidden = !n; }
atualizaBadge();
function addCarrinho(p) {
  const c = lsGet('carrinho', []), it = c.find(x => x.id === p.id && !x.var);
  it ? it.qtd++ : c.push({ id: p.id, qtd: 1, var: '' }); lsSet('carrinho', c);
  atualizaBadge(); toast('Adicionado ao carrinho');
  window.rastrear && rastrear('AddToCart', { value: p.preco, content_ids: [p.id], contents: [{ id: p.id, quantity: 1, item_price: p.preco }], num_items: 1 });
}

// ---------- componentes ----------
const icCart = '<img src="img/icons/cart-plus.svg" alt="" width="22" height="22">';
const icBolt = '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.8L13.5 2Z"/></svg>';
const icStar = '<svg viewBox="0 0 24 24" width="13" height="13" fill="#ffbb00" aria-hidden="true"><path d="m12 2.6 2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8l-5.8 3.3 1.4-6.4-4.9-4.4 6.5-.7z"/></svg>';
const off = p => p.precoDe ? Math.round((1 - p.preco / p.precoDe) * 100) : 0;
const preco = p => { const [i, c] = brl(p.preco).split(','); return `<span class="pr"><small>R$ </small><b>${i}</b><small>,${c}</small>${p.precoDe ? `<s>R$ ${brl(p.precoDe)}</s>` : ''}</span>`; };
const urlProduto = p => `../coqueteleira-element/${p.url}`;
const restante = ate => {
  const t = Math.max(0, Math.floor((new Date(ate) - new Date()) / 1000));
  return [t / 3600, t % 3600 / 60, t % 60].map(x => String(Math.floor(x)).padStart(2, '0'));
};
function itemLista(p, comBarra) {
  const tags = (p.relampago && !comBarra ? `<span class="tag flash">${icBolt} Oferta relâmpago</span>` : '') +
    (p.selo ? `<span class="tag">${p.selo}</span>` : '') + (comBarra && p.freteGratis ? '<span class="tag verde">Frete grátis</span>' : '');
  const barra = comBarra && p.relampago ? `<div class="bar"><i style="width:${p.relampago.vendidosPct}%"></i><span>${p.relampago.vendidosPct}% vendidos</span></div>` : '';
  return `<div class="li"><a href="${urlProduto(p)}"><img src="${p.img}" alt="" loading="lazy"></a><div class="bd">
    <a href="${urlProduto(p)}"><h3>${p.titulo}</h3></a>
    <div class="tags">${tags}</div>${barra}
    ${comBarra ? '' : `<div class="rt">${p.avaliacoes ? `${icStar}${p.nota.toFixed(1)}<span class="vl"></span>${fmtK(p.vendidos)} vendidos` : 'Novo produto'}</div>`}
    <div class="pf">${preco(p)}<div class="buy"><button class="c" data-add="${p.id}" aria-label="Adicionar ao carrinho">${icCart}</button><button class="k" data-go="${urlProduto(p)}">Comprar</button></div></div>
  </div></div>`;
}
function cardGrade(p, rank) {
  return `<div class="gc">${rank ? `<span class="rank r${rank}">${rank}</span>` : ''}
    <div class="ft"><a href="${urlProduto(p)}"><img src="${p.img}" alt="" loading="lazy"></a>${rank ? '' : `<button class="add" data-add="${p.id}" aria-label="Adicionar ao carrinho">${icCart}</button>`}</div>
    <a href="${urlProduto(p)}"><h3>${p.titulo}</h3></a>
    ${off(p) && !rank ? `<div class="tags"><span class="tag">${p.selo || `-${off(p)}%`}</span></div>` : ''}
    <div class="gp">${preco(p)}</div></div>`;
}

// ---------- Início ----------
const flashProds = PRODUTOS.filter(p => p.relampago && new Date(p.relampago.ate) > new Date());
const porVenda = [...PRODUTOS].sort((a, b) => b.vendidos - a.vendidos);
const porData = [...PRODUTOS].sort((a, b) => b.lancamento.localeCompare(a.lancamento));
$('p-inicio').innerHTML =
  (flashProds.length ? `<section class="sec"><div class="sh"><h2 class="flash-t">Oferta ${icBolt.replace(/12/g, '18')} relâmpago</h2>
    <span class="cd">Termina em <b data-cd></b>:<b data-cd></b>:<b data-cd></b></span></div>
    ${flashProds.slice(0, 3).map(p => itemLista(p, true)).join('')}</section>` : '') +
  `<section class="sec"><div class="sh"><h2>Escolhas pra você</h2></div><div class="row3">${PRODUTOS.slice(0, 3).map(p => cardGrade(p)).join('')}</div></section>` +
  `<section class="sec"><div class="sh"><h2>Lançamentos</h2><button class="more" data-tab="produtos" data-ord="novo">Ver mais ›</button></div><div class="row3">${porData.slice(0, 3).map(p => cardGrade(p)).join('')}</div></section>` +
  `<section class="sec"><div class="sh"><h2>Mais vendidos</h2><button class="more" data-tab="produtos" data-ord="vend">Ver mais ›</button></div><div class="row3">${porVenda.slice(0, 3).map((p, i) => cardGrade(p, i + 1)).join('')}</div></section>`;
function tickFlash() {
  if (!flashProds.length) return;
  const r = restante(flashProds[0].relampago.ate);
  document.querySelectorAll('[data-cd]').forEach((el, i) => el.textContent = r[i % 3]);
}
tickFlash(); setInterval(tickFlash, 1000);

// ---------- Produtos ----------
let ordem = 'rec', precoAsc = true, filtroCat = null, termo = '';
function renderLista() {
  let l = PRODUTOS.filter(p => (!filtroCat || p.categoria === filtroCat) && (!termo || p.titulo.toLowerCase().includes(termo)));
  if (ordem === 'vend') l.sort((a, b) => b.vendidos - a.vendidos);
  if (ordem === 'novo') l.sort((a, b) => b.lancamento.localeCompare(a.lancamento));
  if (ordem === 'preco') l.sort((a, b) => precoAsc ? a.preco - b.preco : b.preco - a.preco);
  $('lista').innerHTML = (filtroCat ? `<p class="vazio">Categoria: <b>${filtroCat}</b> · <a href="#" data-limpa style="color:var(--primary)">ver todas</a></p>` : '') +
    (l.length ? l.map(p => itemLista(p)).join('') : '<p class="vazio">Nenhum produto encontrado.</p>');
}
$('fil').onclick = e => {
  const b = e.target.closest('[data-o]'); if (!b) return;
  if (b.dataset.o === 'preco' && ordem === 'preco') precoAsc = !precoAsc;
  ordem = b.dataset.o;
  $('fil').querySelectorAll('[data-o]').forEach(x => x.classList.toggle('on', x === b));
  renderLista();
};
renderLista();

// ---------- Categorias ----------
const cats = {};
PRODUTOS.forEach(p => { (cats[p.categoria] = cats[p.categoria] || []).push(p); });
$('p-categorias').innerHTML = Object.entries(cats).map(([c, ps]) =>
  `<button class="cat" data-cat="${c}"><img src="${ps[0].img}" alt=""><b>${c}</b><span>${ps.length}</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--text3)"><path d="m9 5 7 7-7 7"/></svg></button>`).join('');

// ---------- abas e navegação ----------
function aba(t) {
  $('tabs').querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ['inicio', 'produtos', 'categorias'].forEach(k => $('p-' + k).hidden = k !== t);
  const topoAbas = $('tabs').offsetTop - 56;
  if (scrollY > topoAbas) scrollTo({ top: topoAbas });
}
$('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) aba(b.dataset.t); };
document.addEventListener('click', e => {
  const add = e.target.closest('[data-add]'), go = e.target.closest('[data-go]'), mais = e.target.closest('[data-tab]'),
    cat = e.target.closest('[data-cat]'), limpa = e.target.closest('[data-limpa]');
  if (add) { e.preventDefault(); addCarrinho(PRODUTOS.find(p => p.id === add.dataset.add)); }
  else if (go) location.href = go.dataset.go + (go.dataset.go.includes('?') ? '&' : '?') + 'comprar=1';
  else if (mais) { ordem = mais.dataset.ord; $('fil').querySelector(`[data-o="${ordem}"]`).click(); aba('produtos'); }
  else if (cat) { filtroCat = cat.dataset.cat; renderLista(); aba('produtos'); }
  else if (limpa) { e.preventDefault(); filtroCat = null; renderLista(); }
});

// cabeçalho: fica branco ao rolar; busca filtra a aba Produtos
const hdr = $('hdr');
addEventListener('scroll', () => {
  hdr.classList.toggle('solid', scrollY > 40 || !$('busca').hidden);
  $('toTop').hidden = scrollY < innerHeight;
}, { passive: true });
$('toTop').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
$('hBack').onclick = () => history.length > 1 ? history.back() : (location.href = 'index.html');
$('hSearch').onclick = () => {
  const b = $('busca'); b.hidden = !b.hidden; $('sp').hidden = !b.hidden;
  hdr.classList.toggle('solid', !b.hidden || scrollY > 40);
  if (!b.hidden) { aba('produtos'); b.focus(); } else { termo = ''; b.value = ''; renderLista(); }
};
$('busca').oninput = e => { termo = e.target.value.trim().toLowerCase(); renderLista(); };
$('hShare').onclick = async () => {
  try { if (navigator.share) return await navigator.share({ title: LOJA.nome, url: location.href }); } catch (e) { return; }
  try { await navigator.clipboard.writeText(location.href); toast('Link copiado'); } catch (e) {}
};
</script>


</body></html>
